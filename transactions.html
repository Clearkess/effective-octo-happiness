<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Transactions — BlockHarbor Markets</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css" />
  <!-- Vercel Speed Insights -->
  <script type="module">
    import { injectSpeedInsights } from 'https://cdn.jsdelivr.net/npm/@vercel/speed-insights@1/dist/index.mjs';
    injectSpeedInsights();
  </script>
</head>
<body data-protected="true">
  <div class="container page-shell">
    <header class="subpage-topbar">
      <a class="brand" href="index.html"><span class="brand-mark">◈</span>BlockHarbor Markets</a>
      <div class="nav-actions">
        <button class="btn btn-ghost theme-toggle" type="button">Light mode</button>
        <a class="btn btn-ghost" href="dashboard.html">Dashboard</a>
        <button class="btn btn-secondary" data-logout type="button">Logout</button>
      </div>
    </header>

    <section class="section-heading compact">
      <div class="eyebrow">Ledger</div>
      <h1>Transaction history</h1>
      <p class="lead small">Deposits, trades, verification milestones and withdrawals.</p>
    </section>

    <section class="cards-3 section transaction-summary" aria-label="Transaction summary">
      <div class="summary-card glass"><span class="muted">Total transactions</span><strong id="txCount">—</strong></div>
      <div class="summary-card glass"><span class="muted">Pending</span><strong id="txPendingCount">—</strong></div>
      <div class="summary-card glass"><span class="muted">Completed</span><strong id="txCompletedCount">—</strong></div>
    </section>

    <section class="panel glass transaction-panel">
      <div class="panel-head"><h2>All activity</h2><div class="chip-row"><a class="btn btn-secondary btn-sm" href="deposit.html">Deposit</a><a class="btn btn-secondary btn-sm" href="withdraw.html">Withdraw</a></div></div>
      <div class="table-wrap transaction-table-wrap" role="region" aria-label="Transaction history" tabindex="0">
        <table class="data-table transaction-table">
          <thead><tr><th scope="col">Type</th><th scope="col">Asset</th><th scope="col">Amount</th><th scope="col">Value</th><th scope="col">Status</th><th scope="col">Time</th></tr></thead>
          <tbody id="transactionsTableBody"><tr><td colspan="6" class="muted">Loading transactions…</td></tr></tbody>
        </table>
      </div>
    </section>
  <script src="assets/js/app.js"></script>
</body>
</html>
